name: Android checks
on:
  push:
    branches: [main, generico-ford]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            common/build/reports/album-artwork-ui/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
      - name: APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: diplay-generico-apk
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  release:
    # Publishes the debug APK as a GitHub Release so it downloads directly from the GitHub app.
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/generico-ford'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: diplay-generico-apk
          path: apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="generico-${{ github.run_number }}"
          apk=$(ls apk/*.apk | head -1)
          cp "$apk" "DiPlay-generico-${{ github.run_number }}.apk"
          gh release create "$tag" "DiPlay-generico-${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "DiPlay genérico #${{ github.run_number }}" \
            --notes "APK de prueba compilado desde la rama generico-ford (commit ${{ github.sha }})." \
            --latest
